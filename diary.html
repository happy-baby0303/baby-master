<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💌 육아메이트 다이어리</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>

    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; }
        
        :root {
            --bg-color: #F7F5F0; 
            --card-bg: #FFFFFF;
            --text-title: #3E3A37; 
            --text-main: #5C5652;
            --text-sub: #A39D98;
            --border-color: #F0ECE6;
            
            --primary: #FF8570; 
            --primary-light: #FFF2EF;
            --dad-color: #6DA0FF; 
            --mom-color: #FF8570;
            
            --shadow-sm: 0 4px 16px rgba(138, 126, 116, 0.05);
            --shadow-md: 0 12px 32px rgba(138, 126, 116, 0.08);
            --shadow-float: 0 20px 40px rgba(138, 126, 116, 0.12);
        }

        html.dark-mode {
            --bg-color: #121212;
            --card-bg: #1C1C1E;
            --text-title: #F5F5F7;
            --text-main: #D1D1D6;
            --text-sub: #8E8E93;
            --border-color: #2C2C2E;
            --primary: #FF8A75;
            --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.6);
            --shadow-float: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        body { background: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; transition: background 0.3s, color 0.3s; overflow-x: hidden; }
        .wrapper { width: 100%; max-width: 480px; padding: 20px 20px 60px 20px; display: flex; flex-direction: column; position: relative; }
        
        .nav-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-top: 10px; }
        .home-btn { background: var(--card-bg); border: 1px solid var(--border-color); font-size: 15px; color: var(--text-main); cursor: pointer; font-weight: 800; padding: 10px 16px; border-radius: 14px; transition: 0.2s; box-shadow: var(--shadow-sm); }
        .home-btn:active { transform: scale(0.95); }
        
        .coin-badge { background: #FFF7E6; color: #D48806; padding: 10px 16px; border-radius: 16px; font-size: 15px; font-weight: 900; display: flex; align-items: center; gap: 6px; cursor: pointer; border: 1px solid #FFE58F; box-shadow: 0 4px 12px rgba(212, 136, 6, 0.15); transition: 0.2s; }
        .coin-badge:active { transform: scale(0.95); }
        
        .tab-group { display: flex; background: #EBE5DD; border-radius: 20px; overflow: hidden; padding: 4px; margin-bottom: 24px; }
        .tab-btn { flex: 1; background: transparent; color: #8A7E78; border: none; padding: 12px 0; border-radius: 16px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: var(--card-bg); box-shadow: var(--shadow-sm); color: var(--text-title); font-weight: 900; } 

        .view-section { display: none; animation: fadeIn 0.4s ease-out; }
        .view-section.active { display: flex; flex-direction: column; flex-grow: 1; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card-bg); border-radius: 36px; padding: 48px 24px 32px 24px; box-shadow: var(--shadow-md); border: 1px solid #FFFFFF; text-align: center; display: flex; flex-direction: column; margin-bottom: 20px; transition: 0.3s; position: relative; overflow: hidden; }

        .day-badge-wrap { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 24px; }
        .nav-badge { background: #F5F1EA; color: var(--text-sub); width: 36px; height: 36px; border-radius: 50%; font-size: 14px; font-weight: 900; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; border: none; }
        .nav-badge:active { transform: scale(0.9); background: #EBE5DD; }
        
        .day-text { font-family: 'Georgia', serif; font-size: 16px; font-weight: 900; color: var(--primary); letter-spacing: 1px; }
        .question { font-size: 21px; font-weight: 800; line-height: 1.6; color: var(--text-title); word-break: keep-all; letter-spacing: -0.5px; margin-bottom: 36px; padding: 0 10px; }
        
        .unlinked-notice { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: #FFF5F2; border: 1.5px dashed #FFB4A2; padding: 12px 20px; border-radius: 20px; margin: 0 auto 28px auto; box-shadow: 0 4px 12px rgba(255, 133, 112, 0.08); }
        .unlinked-notice p { font-size: 13px; color: #D25E4B; margin: 0; font-weight: 700; word-break: keep-all; }

        textarea { width: 100%; min-height: 180px; border: 2px solid var(--border-color); background: #FDFBF9; font-size: 16px; color: var(--text-main); resize: none; outline: none; line-height: 1.8; text-align: center; font-weight: 600; padding: 32px 24px; border-radius: 24px; transition: 0.3s; box-shadow: inset 0 4px 12px rgba(138, 126, 116, 0.04); }
        textarea:focus { border-color: #FFB4A2; background: #FFF; box-shadow: 0 0 0 4px var(--primary-light), inset 0 2px 8px rgba(138, 126, 116, 0.02); }
        textarea::placeholder { color: #C2BDB8; font-weight: 500; }
        
        .answer-bubble { background: #FDFBF9; border: 1px solid var(--border-color); padding: 24px 20px; border-radius: 24px; margin-bottom: 16px; text-align: left; position: relative; box-shadow: var(--shadow-sm); }
        .answer-bubble.dad { border-top: 4px solid var(--dad-color); }
        .answer-bubble.mom { border-top: 4px solid var(--mom-color); }
        .bubble-role { font-size: 13px; font-weight: 900; margin-bottom: 12px; color: var(--text-sub); letter-spacing: 0.5px; }
        .bubble-text { font-size: 16px; line-height: 1.7; color: var(--text-main); white-space: pre-wrap; word-break: keep-all; font-weight: 600; }
        
        .edit-answer-btn { position: absolute; top: 16px; right: 16px; background: #FFF; color: var(--text-sub); border: 1px solid var(--border-color); border-radius: 10px; padding: 6px 12px; font-size: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: var(--shadow-sm); }
        .edit-answer-btn:active { transform: scale(0.95); }

        .save-btn { width: 100%; padding: 20px; background: #5D5651; color: #FFF; border: none; border-radius: 20px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 24px rgba(93, 86, 81, 0.2); margin-top: 24px; }
        .save-btn:active { transform: scale(0.97); }

        .next-btn { width: 100%; padding: 20px; background: #F2F0EB; color: var(--text-main); border: none; border-radius: 20px; font-size: 15px; font-weight: 800; cursor: pointer; display: none; margin-top: 10px; transition: 0.2s; }

        /* =======================================================
           🎮 2. 거실 꾸미기 모달
           ======================================================= */
        .room-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: none; flex-direction: column; justify-content: flex-end; z-index: 9999; }
        .room-modal-content { background: var(--bg-color); width: 100%; height: 90vh; border-radius: 32px 32px 0 0; display: flex; flex-direction: column; overflow: hidden; transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 -20px 50px rgba(0,0,0,0.15); }
        .room-header { padding: 24px; display: flex; justify-content: space-between; align-items: center; background: #FFF; border-bottom: 1px solid var(--border-color); z-index: 20; }
        
        .virtual-room { 
            position: relative; 
            height: 260px; 
            background: #FCFAED; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0;
        }

        .room-window-base {
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 120px;
            background: linear-gradient(to bottom, #FFDAB9, #AEE2FF); 
            border: 8px solid #FFFFFF;
            border-radius: 55px 55px 0 0;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.08), 0 6px 20px rgba(255,255,255,0.8);
            z-index: 1;
            overflow: hidden;
        }
        .room-window-base::before { content: ''; position: absolute; top: 0; left: 50%; width: 4px; height: 100%; background: #FFF; transform: translateX(-50%); }
        .room-window-base::after { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 4px; background: #FFF; transform: translateY(-50%); }
        .cloud { position: absolute; font-size: 20px; opacity: 0.9; animation: floatCloud 25s linear infinite; z-index: 0; }
        @keyframes floatCloud { from { transform: translateX(110px); } to { transform: translateX(-40px); } }

        .wainscoting {
            position: absolute;
            bottom: 35%; left: 0; width: 100%; height: 25%;
            background: transparent;
            border-top: 1px solid #EAE3D9;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            z-index: 0;
        }
        .wainscoting-panel { width: 30%; height: 70%; border: 1.5px solid #F0ECE6; border-radius: 4px; }

        .room-floor {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 35%;
            background-color: #E2D3C4;
            background-image: linear-gradient(0deg, rgba(100,80,60,0.04) 1px, transparent 1px);
            background-size: 100% 16px;
            border-top: 10px solid #FFFFFF;
            z-index: 0;
        }

        .room-rug {
            position: absolute;
            bottom: 4%;
            left: 50%;
            transform: translateX(-50%);
            width: 210px;
            height: 55px;
            background: #FDFBF9;
            border-radius: 50%;
            box-shadow: 0 6px 12px rgba(100,80,60,0.08);
            border: 1.5px dashed #EAE3D9;
            z-index: 1;
        }

        .pedestal {
            position: absolute;
            width: 65px; 
            height: 18px;
            background: linear-gradient(135deg, #FFFFFF 0%, #E5E8EB 100%);
            border-radius: 50%;
            box-shadow: 0 8px 12px rgba(0,0,0,0.08);
            display: flex;
            justify-content: center;
            opacity: 0;
            transform: scale(0);
            transition: 0.4s ease-out;
        }
        .pedestal.active { opacity: 1; transform: scale(1); }
        .pedestal-item { position: absolute; bottom: 10px; font-size: 48px; filter: drop-shadow(0 8px 8px rgba(0,0,0,0.12)); }

        .shop-area { flex: 1; background: var(--input-bg); padding: 20px; overflow-y: auto; z-index: 20; position: relative; }
        .shop-grid { display: flex; flex-direction: column; gap: 12px; }
        .shop-item { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; box-shadow: var(--shadow-sm); }
        .shop-item:active { transform: scale(0.98); }
        .shop-item.owned { opacity: 0.4; pointer-events: none; background: transparent; box-shadow: none; border: 1px dashed var(--border-color); filter: grayscale(100%); }
        
        .shop-item-left { display: flex; align-items: center; gap: 16px; }
        .shop-item-icon-wrap { width: 50px; height: 50px; background: #F8F9FA; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
        .shop-item-name { font-size: 15px; font-weight: 800; color: var(--text-title); margin-bottom: 4px; }
        .shop-item-desc { font-size: 12px; font-weight: 600; color: var(--text-sub); }
        
        .shop-item-price { font-size: 14px; font-weight: 900; color: #191F28; background: #F2F4F6; padding: 8px 16px; border-radius: 12px; flex-shrink: 0; }
        .shop-item.owned .shop-item-price { background: transparent; color: var(--text-sub); padding: 0; }

        .history-list { display: flex; flex-direction: column; gap: 16px; padding-bottom: 40px; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-sub); font-size: 15px; line-height: 1.6; font-weight: 700; }
        .history-card { background: var(--card-bg); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .history-day-label { font-family: 'Georgia', serif; font-size: 13px; font-weight: 800; color: var(--primary); letter-spacing: 1px; }
        .q-text { font-size: 18px; font-weight: 900; color: var(--text-title); margin-bottom: 20px; line-height: 1.4; word-break: keep-all; }
        .a-text { font-size: 15px; color: var(--text-main); line-height: 1.6; margin-bottom: 12px; background: #FDFBF9; padding: 16px; border-radius: 14px; }
        .a-role { font-size: 12px; font-weight: 900; color: var(--text-sub); margin-bottom: 6px; }

        .book-progress-wrap { background: var(--card-bg); padding: 24px; border-radius: 24px; box-shadow: var(--shadow-sm); margin-bottom: 24px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <div class="wrapper">
        <header class="nav-header">
            <div style="display:flex; gap:8px;">
                <button class="home-btn" onclick="window.location.href='index.html'">❮ 홈</button>
            </div>
            <div class="coin-badge" onclick="openRoomModal()">
                <span>🪙</span> <span id="header-coin-count">0</span>
            </div>
        </header>

        <div style="display: flex; justify-content: center; margin-bottom: 32px;">
            <div class="tab-group" style="width: 100%;">
                <button class="tab-btn active" id="btn-tab-write" onclick="switchTab('write')">오늘의 기록</button>
                <button class="tab-btn" id="btn-tab-read" onclick="switchTab('read')">우리의 책장</button>
            </div>
        </div>

        <!-- ✍️ 쓰기 탭 -->
        <div id="view-write" class="view-section active">
            <main class="card">
                <div class="day-badge-wrap">
                    <button class="nav-badge" onclick="moveQuestion(-1)">❮</button>
                    <div><div class="day-text" id="diary-day">DAY 1</div></div>
                    <button class="nav-badge" onclick="moveQuestion(1)">❯</button>
                </div>

                <h1 class="question" id="question-text">질문을 불러오는 중입니다...</h1>
                
                <div id="answer-section">
                    <!-- 입력 모드 -->
                    <div id="input-mode">
                        <div class="unlinked-notice" id="unlinked-notice" style="display: none;">
                            <p>💌 연동 전 작성한 글은 <b>나만의 일기장</b>에 쏙 보관돼요!</p>
                        </div>
                        <textarea id="my-answer" placeholder="오늘 하루도 고생 많았어요.&#13;&#10;가장 솔직한 마음을 한 줄 남겨주세요..."></textarea>
                        <button class="save-btn" id="btn-submit">기록 남기기</button>
                    </div>

                    <!-- 보기 모드 -->
                    <div id="view-mode" style="display: none;">
                        <div class="answer-bubble dad" id="view-husband-card" style="display:none;">
                            <button class="edit-answer-btn" onclick="enableEditMode('husband')" id="edit-btn-husband" style="display:none;">수정</button>
                            <div class="bubble-role">아빠</div>
                            <div class="bubble-text" id="view-husband-text"></div>
                        </div>

                        <div class="answer-bubble mom" id="view-wife-card" style="display:none;">
                            <button class="edit-answer-btn" onclick="enableEditMode('wife')" id="edit-btn-wife" style="display:none;">수정</button>
                            <div class="bubble-role">엄마</div>
                            <div class="bubble-text" id="view-wife-text"></div>
                        </div>
                        
                        <button class="next-btn" id="next-btn" onclick="moveQuestion(1)">다음 페이지 작성하기 ❯</button>
                    </div>
                </div>
            </main>
        </div>

        <!-- 📖 서재 (모아보기) 탭 -->
        <div id="view-read" class="view-section">
            <div class="book-progress-wrap" style="text-align: center; border: 1px solid var(--primary); background: #FFF5F2;">
                <div style="font-size:16px; font-weight:900; color:var(--text-title); margin-bottom: 8px;">📖 우리 부부만의 프리미엄 에세이 북</div>
                <div style="font-size:13px; color:var(--text-main); line-height: 1.5; font-weight: 600; margin-bottom: 16px;">
                    100개의 소중한 기록이 모이면,<br>
                    <span style="color:var(--primary); font-weight:900;">프리미엄 출판 서비스</span>를 통해 세상에 하나뿐인<br>
                    우리 두 사람만의 책을 소장할 수 있어요.
                </div>
                <button onclick="window.showToast('✨ 곧 프리미엄 출판 서비스 상세페이지가 공개됩니다!')" style="background:var(--primary); color:white; border:none; padding:10px 20px; border-radius:12px; font-size:12px; font-weight:900; cursor:pointer;">
                    프리미엄 혜택 확인하기
                </button>
            </div>

            <main class="history-list" id="history-container"></main>

            <!-- 🚨 [테스트용 강제 초기화 버튼 복구] (모든 테스트 끝난 후 지우시면 됩니다) -->
            <button onclick="clearDiaryData()" style="margin: 20px auto 40px auto; display: block; background: #FFF0F1; color: #F04452; border: 1px dashed #F04452; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; transition:0.2s;">
                🗑️ 테스트용 다이어리 전체 초기화 (서버포함)
            </button>
        </div>
    </div>

    <!-- 🎮 거실 꾸미기 모달 -->
    <div id="room-modal" class="room-modal-overlay" onclick="closeRoomModal(event)">
        <div class="room-modal-content" onclick="event.stopPropagation()">
            <div class="room-header">
                <div style="font-size: 18px; font-weight: 900; color: var(--text-title);">🧸 우리가족 거실</div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="coin-badge" style="margin: 0; padding: 8px 12px; background:var(--bg-color); border:none; box-shadow:none; color:var(--text-title);">
                        <span>🪙</span> <span id="modal-coin-count">0</span>
                    </div>
                    <button onclick="closeRoomModalForce()" style="background: none; border: none; font-size: 24px; color: var(--text-sub); cursor: pointer;">✕</button>
                </div>
            </div>
            
            <div class="virtual-room">
                <div class="room-window-base">
                    <div class="cloud" style="top: 15px; animation-duration: 18s;">☁️</div>
                </div>
                <div class="wainscoting">
                    <div class="wainscoting-panel"></div>
                    <div class="wainscoting-panel"></div>
                </div>
                <div class="room-floor"></div>
                <div class="room-rug"></div>
                <div id="virtual-room-area" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:10;"></div>
            </div>

            <div class="shop-area">
                <div style="font-size: 14px; font-weight: 800; color: var(--text-sub); margin-bottom: 16px;">가구 상점</div>
                <div class="shop-grid" id="shop-grid-container"></div>
            </div>
        </div>
    </div>

    <!-- 👩‍👧 온보딩 모달 -->
    <div id="setup-modal" class="modal-overlay" style="display:none; z-index:99999; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); justify-content:center; align-items:center;">
        <div style="background:var(--card-bg); width:100%; max-width:320px; border-radius:24px; padding:32px 24px; text-align:center;">
            <h2 style="font-size:22px; font-weight:900; margin-bottom:12px; color:var(--text-title);" id="diary-welcome-title">반가워요! 👋</h2>
            <p style="margin-bottom:30px; color:var(--text-sub); line-height:1.5; font-weight:600; font-size:15px;">서로의 이야기를 담기 위해<br>나의 역할을 선택해주세요.</p>
            <div style="display:flex; gap:10px;">
                <button onclick="saveSetup('husband')" style="flex:1; padding:20px 0; background:var(--primary-light); border:1px solid #B1D6FF; border-radius:16px; color:var(--primary); font-size:16px; font-weight:900; cursor:pointer;">👨 아빠</button>
                <button onclick="saveSetup('wife')" style="flex:1; padding:20px 0; background:var(--mom-light); border:1px solid #FFD1D1; border-radius:16px; color:var(--mom-color); font-size:16px; font-weight:900; cursor:pointer;">👩 엄마</button>
            </div>
        </div>
    </div>

    <script>
        const questionDB = [
            { id: 1, target: "부부 공통", category: "위로", question: "오늘 하루, 육아와 일상으로 고생한 서로에게 가장 먼저 건네고 싶은 말은 무엇인가요?" },
            { id: 2, target: "부부 공통", category: "사랑", question: "배우자가 아기를 안고 있을 때, 가장 아름답고 고맙다고 느꼈던 순간은 언제인가요?" },
            { id: 3, target: "부부 공통", category: "성장", question: "육아를 하면서 나의 부모님을 비로소 깊게 이해하게 된 순간이 있나요?" },
            { id: 4, target: "부부 공통", category: "미래", question: "아기가 10살이 되면, 주말에 세 식구가 다 함께 어떤 취미를 공유하고 싶나요?" }
        ];

        const FURNITURE_DB = [
            { id: 'tent', name: '인디언 텐트', desc: '아늑한 우리 가족 아지트', price: 100, icon: '⛺', style: 'bottom: 20%; left: 8%; font-size: 90px; z-index: 3;' },
            { id: 'sofa', name: '패브릭 소파', desc: '푹신하고 편안한 휴식 공간', price: 150, icon: '🛋️', style: 'bottom: 22%; right: 8%; font-size: 85px; z-index: 4;' },
            { id: 'mobile', name: '원목 모빌', desc: '바람에 살랑이는 빙글빙글 모빌', price: 200, icon: '🎐', style: 'top: 10%; left: 25%; font-size: 60px; z-index: 10;' },
            { id: 'toy', name: '애착 인형', desc: '매일 품에 꼭 안고 자는 곰돌이', price: 250, icon: '🧸', style: 'bottom: 15%; left: 45%; font-size: 50px; z-index: 6;' }
        ];
    </script> 
    
    <!-- 🚨 [서버 연동 & 완전 폭파 스크립트 모듈] -->
    <script type="module">
        // deleteDoc 을 추가로 불러와야 파이어베이스에 남은 좀비 기록을 죽일 수 있습니다.
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCx-Jd-6S05a_xY0ZbT8SjpH0vPWIhSDd4",
            authDomain: "diray-8c002.firebaseapp.com",
            projectId: "diray-8c002",
            storageBucket: "diray-8c002.firebasestorage.app",
            messagingSenderId: "340346494414",
            appId: "1:340346494414:web:aba027d55a34fcf01f9f9f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app); 
        const auth = getAuth(app);
        
        signInAnonymously(auth).catch(() => console.log("익명로그인 무시"));

        let unsubscribe = null;

        window.getCurrentDay = function() {
            return parseInt(document.getElementById("diary-day").innerText.replace("DAY ", "")) || 1;
        };

        window.startSync = function() {
            const currentDay = window.getCurrentDay();
            const currentRole = localStorage.getItem("tosil_userRole") || "husband";
            const syncCode = localStorage.getItem("family_sync_code") || "unlinked_local_diary";
            
            const noticeEl = document.getElementById("unlinked-notice");
            if (noticeEl) noticeEl.style.display = (syncCode !== "unlinked_local_diary") ? "none" : "inline-flex"; 

            const localDataStr = localStorage.getItem(`day_${currentDay}_data`);
            let localData = localDataStr ? JSON.parse(localDataStr) : {};

            window.renderCurrentCard(localData, currentRole);

            const docRef = doc(db, "diary_" + syncCode, `day_${currentDay}`);
            if (unsubscribe) unsubscribe();

            unsubscribe = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const fireData = docSnap.data();
                    localStorage.setItem(`day_${currentDay}_data`, JSON.stringify(fireData));
                    window.renderCurrentCard(fireData, currentRole);
                }
            });
        };

        window.renderCurrentCard = function(data, currentRole) {
            const hText = data.husbandAns || "";
            const wText = data.wifeAns || "";
            const myAns = (currentRole === "husband") ? hText : wText;
            const isEditing = document.getElementById("btn-submit").innerText.includes("수정");

            if (myAns && !isEditing) {
                document.getElementById("input-mode").style.display = "none";
                document.getElementById("view-mode").style.display = "block";

                const hCard = document.getElementById("view-husband-card");
                const hTextEl = document.getElementById("view-husband-text");
                const hEditBtn = document.getElementById("edit-btn-husband");
                
                hCard.style.display = "block";
                if (hText) {
                    hTextEl.innerText = hText;
                    hCard.style.opacity = "1";
                    hEditBtn.style.display = (currentRole === "husband") ? "block" : "none";
                } else {
                    hTextEl.innerText = "아빠의 답변을 기다리는 중입니다...";
                    hCard.style.opacity = "0.5";
                    hEditBtn.style.display = "none";
                }

                const wCard = document.getElementById("view-wife-card");
                const wTextEl = document.getElementById("view-wife-text");
                const wEditBtn = document.getElementById("edit-btn-wife");

                wCard.style.display = "block";
                if (wText) {
                    wTextEl.innerText = wText;
                    wCard.style.opacity = "1";
                    wEditBtn.style.display = (currentRole === "wife") ? "block" : "none";
                } else {
                    wTextEl.innerText = "엄마의 답변을 기다리는 중입니다...";
                    wCard.style.opacity = "0.5";
                    wEditBtn.style.display = "none";
                }

                if (hText && wText) {
                    document.getElementById("next-btn").style.display = "block";
                } else {
                    document.getElementById("next-btn").style.display = "none";
                }
            } else if (!myAns && !isEditing) {
                document.getElementById("input-mode").style.display = "block";
                document.getElementById("view-mode").style.display = "none";
            }
        };

        window.enableEditMode = function(roleToEdit) {
            const currentRole = localStorage.getItem("tosil_userRole") || "husband";
            if (currentRole !== roleToEdit) return; 

            const currentDay = window.getCurrentDay();
            const rawData = localStorage.getItem(`day_${currentDay}_data`);
            let ans = "";
            if (rawData) {
                const data = JSON.parse(rawData);
                ans = (currentRole === "husband") ? (data.husbandAns || "") : (data.wifeAns || "");
            }
            
            document.getElementById("view-mode").style.display = "none";
            document.getElementById("input-mode").style.display = "block";
            
            const answerInput = document.getElementById("my-answer");
            answerInput.value = ans;
            answerInput.focus();
            
            document.getElementById("btn-submit").innerText = "수정 완료하기";
        };

        document.getElementById("btn-submit").addEventListener("click", async () => {
            const ans = document.getElementById("my-answer").value.trim();
            if(!ans) return window.showToast("마음을 한 줄이라도 남겨주세요! 🥺");

            const btn = document.getElementById("btn-submit");
            const isEditing = btn.innerText.includes("수정");
            
            btn.innerText = "저장 중... ⏳";
            btn.disabled = true;

            const currentDay = window.getCurrentDay();
            const currentRole = localStorage.getItem("tosil_userRole") || "husband";
            const syncCode = localStorage.getItem("family_sync_code") || "unlinked_local_diary";

            let localData = {};
            const existing = localStorage.getItem(`day_${currentDay}_data`);
            if (existing) {
                try { localData = JSON.parse(existing); } catch(e) {}
            }
            if (currentRole === "husband") localData.husbandAns = ans;
            else localData.wifeAns = ans;
            localData.date = new Date().toISOString();

            localStorage.setItem(`day_${currentDay}_data`, JSON.stringify(localData));

            try {
                const docRef = doc(db, "diary_" + syncCode, `day_${currentDay}`);
                const updateData = (currentRole === "husband") 
                    ? { husbandAns: ans, date: new Date().toISOString() } 
                    : { wifeAns: ans, date: new Date().toISOString() };
                await setDoc(docRef, updateData, { merge: true });
            } catch(e) { console.log(e); }

            btn.innerText = "기록 남기기"; 
            btn.disabled = false;
            
            window.renderCurrentCard(localData, currentRole);
            window.showToast("🎉 기록이 예쁘게 저장되었습니다!");
        });

        // 🚨 [강제 초기화 패치] 기기(로컬) + 파이어베이스(서버) 찌꺼기 완벽 소각!
        window.clearDiaryData = async function() {
            if (confirm("정말 지금까지 쓴 모든 일기를 삭제하시겠습니까?\n(테스트 데이터를 지울 때만 사용하세요!)")) {
                const syncCode = localStorage.getItem("family_sync_code") || "unlinked_local_diary";

                for (let i = 1; i <= 200; i++) {
                    // 1. 기기 데이터 삭제
                    localStorage.removeItem(`day_${i}_data`);
                    localStorage.removeItem(`day_${i}_coin_claimed`);
                    
                    // 2. 서버(파이어베이스) 데이터 삭제 요청 (좀비 데이터 박멸)
                    try {
                        await deleteDoc(doc(db, "diary_" + syncCode, `day_${i}`));
                    } catch(e) {}
                }

                localStorage.removeItem('diary_last_written');
                localStorage.setItem('tosil_coins', '0');
                localStorage.setItem('tosil_inventory', '[]');
                
                window.viewingDay = 1;
                alert("🗑️ 다이어리 및 거실 가구가 서버에서도 완전히 삭제되었습니다.");
                location.reload(true);
            }
        };

        window.showToast = function(msg) {
            const oldToast = document.getElementById('diary-toast');
            if (oldToast) oldToast.remove();
            const toast = document.createElement('div');
            toast.id = 'diary-toast';
            toast.innerHTML = msg;
            toast.style.cssText = `position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#fff; padding:12px 24px; border-radius:30px; font-size:14px; font-weight:800; z-index:999999; opacity:0; transition:0.3s; pointer-events:none; white-space:nowrap; box-shadow:var(--shadow-md);`;
            document.body.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 10);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
        };
    </script>

    <script>
        window.updateCoinUI = function() {
            let coins = parseInt(localStorage.getItem('tosil_coins')) || 0;
            document.getElementById('header-coin-count').innerText = coins;
            document.getElementById('modal-coin-count').innerText = coins;
        };

        window.openRoomModal = function() {
            window.updateCoinUI();
            window.renderShop();
            window.renderRoom();
            document.getElementById('room-modal').style.display = 'flex';
            setTimeout(() => {
                document.querySelector('.room-modal-content').style.transform = 'translateY(0)';
            }, 10);
        };

        window.closeRoomModalForce = function() {
            document.querySelector('.room-modal-content').style.transform = 'translateY(100%)';
            setTimeout(() => { document.getElementById('room-modal').style.display = 'none'; }, 400);
        };

        window.closeRoomModal = function(e) {
            if (e.target.id === 'room-modal') window.closeRoomModalForce();
        };

        window.renderShop = function() {
            const container = document.getElementById('shop-grid-container');
            let inventory = JSON.parse(localStorage.getItem('tosil_inventory')) || [];
            
            let html = '';
            FURNITURE_DB.forEach(item => {
                const isOwned = inventory.includes(item.id);
                html += `
                    <div class="shop-item ${isOwned ? 'owned' : ''}" onclick="window.buyItem('${item.id}', ${item.price})">
                        <div class="shop-item-left">
                            <div class="shop-item-icon-wrap">${item.icon}</div>
                            <div style="text-align:left;">
                                <div class="shop-item-name">${item.name}</div>
                                <div class="shop-item-desc">${item.desc || ''}</div>
                            </div>
                        </div>
                        <div class="shop-item-price">${isOwned ? '보유중' : item.price + '🪙'}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        };

        window.buyItem = function(id, price) {
            let inventory = JSON.parse(localStorage.getItem('tosil_inventory')) || [];
            if (inventory.includes(id)) return; 

            let coins = parseInt(localStorage.getItem('tosil_coins')) || 0;
            if (coins < price) {
                return window.showToast("🪙 코인이 부족해요! 부부가 함께 일기를 쓰면 코인이 모여요.");
            }

            if (confirm(`[${FURNITURE_DB.find(i=>i.id===id).name}] 아이템을 방에 놓을까요?`)) {
                coins -= price;
                inventory.push(id);
                localStorage.setItem('tosil_coins', coins);
                localStorage.setItem('tosil_inventory', JSON.stringify(inventory));
                
                window.updateCoinUI();
                window.renderShop();
                window.renderRoom();
                window.showToast("🎁 거실에 새로운 아이템이 배치되었어요!");
            }
        };

        window.renderRoom = function() {
            let inventory = JSON.parse(localStorage.getItem('tosil_inventory')) || [];
            const roomArea = document.getElementById('virtual-room-area');
            
            let html = ``;
            FURNITURE_DB.forEach(item => {
                const isActive = inventory.includes(item.id) ? 'active' : '';
                html += `
                    <div id="item-${item.id}" class="pedestal ${isActive}" style="${item.style}">
                        <div class="pedestal-item">${item.icon}</div>
                    </div>
                `;
            });
            
            roomArea.innerHTML = html;
        };
    </script>

    <script>
        window.babyName = localStorage.getItem('tosil_babyName') || '아기';
        window.viewingDay = 1;

        function getFirstUnansweredDay() {
            for (let i = 1; i <= 200; i++) {
                const dataStr = localStorage.getItem(`day_${i}_data`);
                if (!dataStr) return i; 
                try {
                    const data = JSON.parse(dataStr);
                    if (!data.husbandAns && !data.wifeAns) return i; 
                } catch(e) { return i; }
            }
            return 1;
        }

        window.moveQuestion = function(direction) {
            window.viewingDay += direction;
            if(window.viewingDay < 1) window.viewingDay = 1; 

            document.getElementById("input-mode").style.display = "block";
            document.getElementById("view-mode").style.display = "none";
            document.getElementById("my-answer").value = ""; 
            document.getElementById("btn-submit").innerText = "기록 남기기";

            window.initAppUI();
            setTimeout(window.startSync, 50); 
        };

        window.initAppUI = function() {
            window.updateCoinUI(); 
            const index = (window.viewingDay - 1) % questionDB.length; 
            const todayData = questionDB[index] || { target:"가족", question: "오늘 하루는 어땠나요?" };

            document.getElementById("diary-day").innerText = `DAY ${window.viewingDay}`;
            let qText = todayData.question.replace(/{babyName}/g, window.babyName);
            document.getElementById("question-text").innerText = qText;
        };

        window.switchTab = function(tabName) {
            document.getElementById('btn-tab-write').classList.remove('active');
            document.getElementById('btn-tab-read').classList.remove('active');
            document.getElementById(`btn-tab-${tabName}`).classList.add('active');
            document.getElementById('view-write').classList.remove('active');
            document.getElementById('view-read').classList.remove('active');
            document.getElementById(`view-${tabName}`).classList.add('active');
            if (tabName === 'read') window.renderHistory();
        };

        window.renderHistory = function() {
            const container = document.getElementById('history-container');
            container.innerHTML = ''; 
            let hasRecord = false;
            
            for (let i = 1; i <= 200; i++) {
                const rawData = localStorage.getItem(`day_${i}_data`);
                if (rawData) {
                    try {
                        const d = JSON.parse(rawData);
                        if (d.husbandAns || d.wifeAns) {
                            hasRecord = true;
                            const qData = questionDB[(i - 1) % questionDB.length];
                            const qText = qData ? qData.question.replace(/{babyName}/g, window.babyName) : '';
                            
                            const card = document.createElement('div');
                            card.className = 'history-card';
                            card.innerHTML = `
                                <div class="card-header">
                                    <span class="history-day-label">DAY ${i}</span>
                                </div>
                                <p class="q-text">${qText}</p>
                                ${d.husbandAns ? `<div class="a-text" style="border-left: 3px solid var(--dad-color);"><div class="a-role">아빠</div>${d.husbandAns.replace(/\n/g,'<br>')}</div>` : ''}
                                ${d.wifeAns ? `<div class="a-text" style="border-left: 3px solid var(--mom-color);"><div class="a-role">엄마</div>${d.wifeAns.replace(/\n/g,'<br>')}</div>` : ''}
                            `;
                            container.prepend(card); 
                        }
                    } catch(e) {}
                }
            }
            if (!hasRecord) {
                container.innerHTML = `<div class="empty-state">🌱<br>아직 완성된 페이지가 없어요.</div>`;
            }
        };

        window.saveSetup = function(roleVal) {
            if (!roleVal) return;
            localStorage.setItem('tosil_userRole', roleVal);
            document.getElementById('setup-modal').style.display = 'none';
            location.reload(); 
        };

        window.addEventListener('DOMContentLoaded', () => {
            const savedRole = localStorage.getItem('tosil_userRole'); 
            if (!savedRole) {
                document.getElementById('setup-modal').style.display = 'flex';
            } else {
                window.viewingDay = getFirstUnansweredDay();
                window.initAppUI();
                setTimeout(window.startSync, 50); 
            }
        });
    </script>
</body>
